[project]
name = "oerbarium"
version = "0.1.0"
description = "Collect, parse and map Open Educational Resources (OER) metadata into the DALIA Interchange Format (DIF V1.4)"
readme = "README.md"
authors = [
    { name = "tsmdt", email = "thomas.schmidt@uni-mannheim.de" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "click>=8.1",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
]

[project.scripts]
oerbarium = "oerbarium:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oerbarium*"]

[tool.ruff.lint]
ignore = ["BLE001"]
