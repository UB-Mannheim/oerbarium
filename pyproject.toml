[project]
name = "oerbarium"
version = "0.1.0"
description = "Collect, parse and map Open Educational Resources (OER) metadata into the DALIA Interchange Format (DIF V1.4)"
readme = "README.md"
authors = [
    { name = "tsmdt", email = "thomas.schmidt@uni-mannheim.de" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "click>=8.1",
    "openai>=2.44.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
]

[project.scripts]
oerbarium = "oerbarium:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
